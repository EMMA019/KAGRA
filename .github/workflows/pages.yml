# 安定版は gh-pages のルート。Lumen の play.html が既定（world.json は neon_run）。
# latest/ は master の最新ビルドの全ゲーム（Neon Cat など）。neon_cat.html が入口。
# pr/<number>/ は Preview が足す。ここはルートだけ差し替え、pr/ は残す。
# 配信そのものは pages-deploy.yml が木全体を artifact にする。
# dist/web だけを Pages に上げると /pr/ が消える。

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kagra-pages-root
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127

      - name: Stage Lumen
        run: python scripts/package_web.py --game examples/neon_run_minimal.py --build-wasm --out dist/web

      - name: Stage every game as latest/ (the same page the PR previews serve)
        # The root play.html is the Lumen demo. latest/play.html?game=neon_cat is
        # the stable address of the newest master build of every game. The short
        # entries neon_cat.html and meteor_cat.html (and ?game=<slug> on the root
        # play.html) forward to it. corridor.html and crest.html are untouched.
        run: |
          set -eu
          python scripts/build_browser_preview.py --out dist/web/latest --require-pkg
          python scripts/write_entry_pages.py --root dist/web neon_cat meteor_cat
          test -f dist/web/latest/play.html

      - name: Publish the stable root, keeping PR previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_preview_pages.py --src dist/web --dest ""

      - name: Ask master to deploy the full tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          payload='{"event_type":"kagra-pages","client_payload":{"dest":""}}'
          printf '%s' "$payload" | gh api --method POST "/repos/${GITHUB_REPOSITORY}/dispatches" --input -
