# 同じ --game でデバッグ署名の APK を作り、artifact にする。
# 公開はしない。リリース署名は secrets があるときだけ workflow_dispatch で。
# 秘密はリポジトリに作らない。手順は docs/distribution.md。

name: Package Android

on:
  push:
    branches:
      - master
    paths: &package_android_paths
      - ".github/workflows/package-android.yml"
      - "scripts/package_android.py"
      - "scripts/build_android_native.sh"
      - "scripts/setup_android_sdk.sh"
      - "scripts/check_android_16k.py"
      - ".cargo/config.toml"
      - "kagra/distribute.py"
      - "kagra/contracts.py"
      - "games/**"
      - "kagra-shared/**"
      - "mobile/android/**"
      - "pyproject.toml"
      - "examples/platformer_minimal.py"
  pull_request:
    paths: *package_android_paths
  workflow_dispatch:
    inputs:
      game:
        description: "Example or manifest (repo-relative)"
        default: "examples/platformer_minimal.py"
        type: string
      sign_release:
        description: "assembleRelease with keystore secrets (see docs/distribution.md)"
        default: false
        type: boolean

jobs:
  package:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # android-actions/setup-android は `sdkmanager tools` で落ちる。
      # CI の Android debug APK と同じ scripts/setup_android_sdk.sh。
      - name: Setup Android SDK
        run: bash scripts/setup_android_sdk.sh

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Package the example (debug-signed)
        env:
          KAGRA_GAME: ${{ github.event_name == 'workflow_dispatch' && inputs.game || 'examples/platformer_minimal.py' }}
        run: |
          set -eu
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${KAGRA_ANDROID_NDK_VERSION}"
          fi
          test -d "$ANDROID_NDK_HOME"
          python scripts/package_android.py --game "$KAGRA_GAME" --out dist/android

      # 秘密は作らない。keystore をリポジトリ secrets に置いた人が
      # workflow_dispatch で sign_release を選んだときだけ assembleRelease する。
      - name: Package a release APK when asked
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        env:
          KAGRA_GAME: ${{ inputs.game }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/package_android.py --game "$KAGRA_GAME" --out dist/android --release --skip-native

      # ゲーム APK とは別 applicationId。中身は同梱せず、Pages から落とす。
      # 16 KB 検査はこの後。dist/android/*.apk に両方入った状態で見る。
      - name: Bake the public Pages URL into KAGRA Dev
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          printf 'pages_base=https://%s.github.io/%s\n' "$owner" "$repo" > mobile/android/kagra.pages.properties

      - name: Package KAGRA Dev (debug shell)
        run: |
          set -eu
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${KAGRA_ANDROID_NDK_VERSION}"
          fi
          test -d "$ANDROID_NDK_HOME"
          cd mobile/android
          gradle :dev:assembleDebug --no-daemon --stacktrace
          mkdir -p ../../dist/android
          cp dev/build/outputs/apk/debug/*.apk ../../dist/android/kagra-dev-debug.apk

      # 16 KB ページ（Android 15+ / Pixel 10）と、APK 内の全 .so の DT_NEEDED。
      # llvm-readelf -d と ELF 文字列の両方で、'/' を含む NEEDED があれば落とす。
      # 対象は dist/android の全 APK（platformer-debug.apk と kagra-dev-debug.apk）。
      - name: Check 16 KB alignment and DT_NEEDED
        run: |
          set -eu
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${KAGRA_ANDROID_NDK_VERSION}"
          fi
          test -d "$ANDROID_NDK_HOME"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          shopt -s nullglob
          apks=(dist/android/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "no apk under dist/android" >&2
            exit 1
          fi
          python scripts/check_android_16k.py "${apks[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kagra-android-apk
          path: dist/android/*.apk
          if-no-files-found: error

      - name: Upload KAGRA Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: kagra-dev-apk
          path: dist/android/kagra-dev-debug.apk
          if-no-files-found: error
