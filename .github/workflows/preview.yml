# ブラウザ版を GitHub Pages に出す。有料サービスも秘密も使わない。
# master → /    PR → /pr/<number>/    close でそのディレクトリを消す。
# 手順は docs/preview.md。

name: Preview

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to publish under /pr/<number>/ (empty on master updates /)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127

      - name: Build wasm
        run: ./scripts/build_wasm.sh

      - name: Stage the browser preview
        run: python scripts/build_browser_preview.py --out dist/preview --require-pkg

      - name: Preview URL
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          dest=""
          event="${{ github.event_name }}"
          if [ "$event" = "pull_request" ]; then
            dest="pr/${{ github.event.number }}"
          elif [ "$event" = "workflow_dispatch" ]; then
            pr="${{ github.event.inputs.pr }}"
            if [ -n "$pr" ]; then
              dest="pr/${pr}"
            elif [ "${{ github.ref }}" != "refs/heads/master" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Set the pr input, or run this from master." >&2
              exit 1
            fi
          fi
          if [ -n "$dest" ]; then
            url="${base}/${dest}/"
          else
            url="${base}/"
          fi
          echo "dest=${dest}" >> "$GITHUB_ENV"
          echo "url=${url}" >> "$GITHUB_ENV"
          echo "preview ${url}"

      - name: QR code
        run: |
          python -m pip install segno
          python -c "import os, segno; segno.make(os.environ['url']).save('dist/preview/qr.png', scale=8, border=2)"

      - name: Publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_preview_pages.py --src dist/preview --dest "${dest}"

      - name: Point GitHub Pages at gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          body='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          ok=1
          for i in 1 2 3 4 5; do
            echo "pages config attempt ${i}"
            echo "$body" | gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" --input -
            post=$?
            echo "$body" | gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" --input -
            put=$?
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/builds"
            if [ "$post" = "0" ] || [ "$put" = "0" ]; then
              ok=0
              break
            fi
            sleep 10
          done
          gh api "/repos/${GITHUB_REPOSITORY}/pages" || true
          exit "$ok"

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.url }}
        with:
          script: |
            const marker = "<!-- kagra-preview -->";
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              "## スマホで試す（ケーブル不要）",
              "",
              `プレビュー: ${url}`,
              "",
              `Box Hop: ${url}play.html?game=platformer`,
              "",
              `![QR](${url}qr.png)`,
              "",
              "左スティックで移動、右下でジャンプ、右上でアクション。縦横どちらでも操作できます。",
              "",
              "KAGRA Dev（Actions の artifact `kagra-dev-apk`）を一度入れると、master か PR 番号を選んで同じバンドルを読み直せます。",
              "",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Wait until Pages serves the preview
        run: |
          set -eu
          probe="${url}catalog.json"
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /tmp/kagra-catalog.json -w "%{http_code}" "$probe" || true)
            echo "try ${i} ${probe} -> ${code}"
            if [ "$code" = "200" ] && grep -q platformer /tmp/kagra-catalog.json; then
              exit 0
            fi
            sleep 20
          done
          echo "Pages did not serve ${probe}" >&2
          exit 1

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove the PR directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_preview_pages.py --delete --dest "pr/${{ github.event.number }}"

      - name: Note that the preview was removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- kagra-preview -->";
            const body = [
              marker,
              "この PR のプレビュー（/pr/${{ github.event.number }}/）はクローズに合わせて消しました。",
              "",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
