# PyPI へホイールを公開する。
#
# 起動: git tag v0.1.1 && git push origin v0.1.1
# 事前準備: docs/PUBLISHING.md（Trusted Publisher を PyPI に登録）
#
# Linux は manylinux コンテナ内でビルドする。ホストの setup-python は
# コンテナから見えないので、-i 3.10 のようにバージョンを明示する。
# （v0.1.0 は `python3` 解決に失敗して Linux だけ落ちた）

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels but do not upload to PyPI"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*

  wheels-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2_28"
          command: build
          args: --release --out dist -i 3.10 -i 3.11 -i 3.12
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y alsa-lib-devel pkgconfig
            else
              yum install -y alsa-lib-devel pkgconfig
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*

  # macOS wheels are omitted: the maintainer is on Windows and cannot verify
  # them, and macos-13 sat queued for hours and blocked the v0.1.0 upload.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*

  publish:
    needs: [sdist, wheels-linux, wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
