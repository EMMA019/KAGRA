[package]
name = "kagra-shared"
version = "0.1.0"
edition = "2021"
description = "KAGRA shared runtime for Wasm / Android / iOS (input + session + C ABI)"
license = "MIT"

[lib]
name = "kagra_shared"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# wasm-bindgen エントリ（wasm32 向け）
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "console",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "Element",
] }

[dev-dependencies]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
