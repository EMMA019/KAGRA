[package]
name = "kagra-shared"
version = "0.1.0"
edition = "2021"
description = "KAGRA shared runtime for Wasm / Android / iOS (input + session + 3D/2D renderer + C ABI)"
license = "MIT"

[lib]
name = "kagra_shared"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# wasm-bindgen エントリ（wasm32 向け）
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen-futures"]
# wgpu レンダラ。無効ならセッション／入力／シーン記述だけの純ロジック lib になる。
render = ["dep:wgpu", "dep:raw-window-handle", "dep:pollster"]
# Python バインディング（PyO3）。render を伴うので、Python ゲームマスターが
# dump → WorldPlay.tick → render_world_doc を 1 プロセスで呼べる。
python = ["dep:pyo3", "pyo3/extension-module", "render"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
# テキスト → グリフ・カバレッジ（埋め込み PixelMplus、M+ ライセンス）。
# GPU 非依存: カバレッジ画素を Quad に展開するので wasm / CI でも同じ絵。
ab_glyph = "0.2"

# シーン記述は GPU 非依存のまま 3D を扱うので、行列と頂点型は render feature の
# 外に置く。どちらも純粋な計算で wasm でも動く。
glam = { version = "0.33", default-features = false, features = ["std"] }
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"

# kagra-core（0.19）とは独立に現行世代を使う。古い wgpu の WebGPU バックエンドは
# 今のブラウザが外した limit（maxInterStageShaderComponents）を要求して
# device 作成に失敗するため。
#
# dx12 は外す: wgpu-hal 30 が要求する gpu-allocator 0.28 が windows 0.62.2 で
# コンパイルできない（上流の semver 内破壊）。共有コアの実行先は
# Android(Vulkan/GLES) / iOS(Metal) / Web で、Windows はテスト用の
# オフスクリーンのみなので Vulkan で足りる。
wgpu = { version = "30", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "metal",
    "gles",
    "wgsl",
] }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "0.3", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "console",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "Element",
] }
# Python バインディング。kagra-core と同じ 0.21 を使う（workspace 内で世代を増やさない）。
pyo3 = { version = "0.21", optional = true }

# ブラウザでは WebGPU を優先し、無ければ WebGL2 に落ちる。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", optional = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
pollster = "0.3"

# Desktop WorldDoc window only (example `window`). Same winit 0.29 *line* as
# kagra-core, but a separate process + wgpu 30 via raw-window-handle.
# Native-only: do not compile this example (or pull winit) for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
winit = { version = "0.29", default-features = true }

[[example]]
name = "offscreen"
required-features = ["render"]

[[example]]
name = "window"
required-features = ["render"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
