<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KAGRA shared core (Wasm)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1c2230; color: #e8ecf4; margin: 0; }
    canvas { display: block; width: 100vw; height: 70vh; background: #10151f; touch-action: none; }
    #log { padding: 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    .err { color: #ff9d7a; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="log">loading…</div>
  <script type="module">
    // wasm-pack 出力を想定: pkg/kagra_shared.js
    // ビルド: ./scripts/build_wasm.sh   （features = wasm,render）
    import init, { WasmSession, sharedVersion } from "./pkg/kagra_shared.js";

    const logEl = document.getElementById("log");
    const log = (m, isErr = false) => {
      logEl.textContent = m;
      logEl.className = isErr ? "err" : "";
    };

    await init();
    const session = new WasmSession();
    const canvas = document.getElementById("c");

    // 手動確認・自動テスト用。コンソールから kagra.setPad(1, 0) で四角が動く。
    window.kagra = session;

    // canvas のピクセルサイズと共有コアの座標系を一致させる。
    const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
    const sizeCanvas = () => {
      const scale = dpr();
      canvas.width = Math.max(1, Math.round(canvas.clientWidth * scale));
      canvas.height = Math.max(1, Math.round(canvas.clientHeight * scale));
      session.createSurface(canvas.width, canvas.height);
      return scale;
    };
    let scale = sizeCanvas();

    let rendering = false;
    if (session.renderSupported()) {
      try {
        await session.attachCanvas(canvas);
        rendering = session.hasRenderer();
      } catch (e) {
        log(`renderer unavailable: ${e}\n\nWebGPU も WebGL2 も使えないブラウザです。`, true);
      }
    } else {
      log("this wasm was built without the render feature", true);
    }

    // リサイズは attach 済みサーフェスに反映される（wgpu 側で再構成）。
    window.addEventListener("resize", () => { scale = sizeCanvas(); });

    const PHASE = { begin: 0, move: 1, end: 2, cancel: 3 };
    const send = (e, phase) => {
      session.pushPointer(e.pointerId >>> 0, e.offsetX * scale, e.offsetY * scale, phase, e.pressure || 1);
      if (phase === PHASE.end || phase === PHASE.cancel) {
        session.setPad(0, 0);
      } else {
        // 画面中央を原点にした仮想スティック
        session.setPad(
          Math.max(-1, Math.min(1, (e.offsetX / canvas.clientWidth) * 2 - 1)),
          Math.max(-1, Math.min(1, (e.offsetY / canvas.clientHeight) * 2 - 1)),
        );
      }
    };
    canvas.addEventListener("pointerdown", (e) => send(e, PHASE.begin));
    canvas.addEventListener("pointermove", (e) => { if (e.buttons) send(e, PHASE.move); });
    canvas.addEventListener("pointerup", (e) => send(e, PHASE.end));
    canvas.addEventListener("pointercancel", (e) => send(e, PHASE.cancel));

    // キーボードでも動かせるようにしておく（デスクトップ確認用）
    const held = new Set();
    const padFromKeys = () => {
      const x = (held.has("ArrowRight") || held.has("d") ? 1 : 0) - (held.has("ArrowLeft") || held.has("a") ? 1 : 0);
      const y = (held.has("ArrowDown") || held.has("s") ? 1 : 0) - (held.has("ArrowUp") || held.has("w") ? 1 : 0);
      session.setPad(x, y);
    };
    window.addEventListener("keydown", (e) => { held.add(e.key); padFromKeys(); });
    window.addEventListener("keyup", (e) => { held.delete(e.key); padFromKeys(); });

    const loop = () => {
      const f = session.requestFrame();
      if (rendering) {
        try {
          session.render();
        } catch (e) {
          rendering = false;
          log(`render failed: ${e}`, true);
        }
        if (f % 15 === 0) {
          log(`kagra-shared ${sharedVersion()}  frame=${f}\n${session.statsJson()}\n\nドラッグ / WASD で四角が動きます。`);
        }
      }
      requestAnimationFrame(loop);
    };
    loop();
  </script>
</body>
</html>
