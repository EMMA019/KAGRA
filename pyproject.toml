[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kagra"
version = "0.1.0"
description = "KAGRA - Kernel for Anime/Game Runtime Architecture"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
facetrack = ["mediapipe", "opencv-python"]
dev = ["pytest>=7.0"]

[tool.maturin]
manifest-path = "kagra-core/Cargo.toml"
module-name = "kagra.kagra_core"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "golden: GPU headless screenshot regression (requires built kagra_core)",
]
