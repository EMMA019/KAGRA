[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kagra"
version = "0.1.0"
description = "KAGRA - Kernel for Anime/Game Runtime Architecture"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "kagra-core/Cargo.toml"
module-name = "kagra.kagra_core"
features = ["pyo3/extension-module"]